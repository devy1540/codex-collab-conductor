name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install canary schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate canary results
        run: python scripts/validate_canary_results.py
