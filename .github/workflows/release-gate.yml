name: release-gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install canary schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Validate canary observations
        run: python skills/codex-collab-conductor/scripts/validate_canary_results.py
      - name: Evaluate release gate
        run: python skills/codex-collab-conductor/scripts/validate_canary_results.py --release-gate
